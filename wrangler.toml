# Cấu hình cho Cloudflare Workers.
# Dòng name phải trùng tên Worker trên Cloudflare (Settings -> General -> Name).
name = "dathang"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Trang tĩnh nằm trong web/. Worker đọc qua binding ASSETS.
[assets]
directory = "./web"
binding = "ASSETS"

# Địa chỉ Apps Script và mã bảo vệ KHÔNG để ở đây.
# Đặt trong Cloudflare: Settings -> Variables and Secrets
#   SHEETS_URL   = https://script.google.com/macros/s/…/exec
#   SHEETS_TOKEN = mã bảo vệ đã đặt trong Code.gs
#
# Đường /tru-ton (bên shopbongda trừ tồn khi có đơn web) cần thêm hai Secret:
#   TRU_TON_KHOA = chuỗi khoá dài, tạo ở Cài đặt → "Đơn từ web" trong phần mềm
#   FIREBASE_SA  = nguyên nội dung file JSON service account của dự án Firebase
#
# Đường /tra-ve (bên quét mã tra đơn trả về và cộng lại tồn) dùng chung đúng
# ba biến trên, không cần thêm gì. Xem TRA-VE-KHO.md.
